# Every hour, asks the site to run the email-alerts search (web/api/alerts-run.js). Each user is emailed once a day,
# at their own "New jobs ready by" time. Needs the repo secret CRON_SECRET (the same value as in Vercel).
# Run it by hand from Actions; tick "force" to run again for people who already ran today (testing).
name: Job alerts
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run again for people who already ran today (testing)'
        type: boolean
        default: false
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the alerts search
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          curl -fsS --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "https://jobs4you.vercel.app/api/alerts-run?force=$FORCE"

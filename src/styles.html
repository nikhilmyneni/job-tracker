<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1f1f1d; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #2f5bd3; --ok: #1e7d4f; --bad: #b3261e; --warn: #9a6700; --track: #efeeea;
  --radius: 10px; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1f1e; --fg: #ecebe6; --muted: #a09f99; --line: #34332f;
    --accent: #7a9bff; --ok: #5cc28f; --bad: #ff8a80; --warn: #e3b341; --track: #2a2a28; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); }
a { color: var(--accent); }
.jt { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
.h1 { font: 400 30px/1.2 var(--serif); margin: 0; }
.take { color: var(--muted); margin: 6px 0 0; }
.take b { color: var(--fg); font-weight: 600; }
.meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.lbl, .sub, .note { font-size: 13px; color: var(--muted); }
.num { font: 400 30px/1.15 var(--serif); font-variant-numeric: tabular-nums; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.title { font-size: 17px; font-weight: 600; margin: 0; }
.note { margin: 4px 0 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
input, select, textarea, button { font: inherit; font-size: 14px; color: var(--fg); }
input, select, textarea { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.controls input[type=search] { flex: 1 1 200px; }
textarea { width: 100%; min-height: 220px; resize: vertical; font-size: 13px; }
.btn { cursor: pointer; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); white-space: nowrap; text-decoration: none; display: inline-block; text-align: center; font-size: 13px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--line); }
.btn:disabled { opacity: .55; cursor: default; }
.link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); text-decoration: underline; font-size: 13px; }
.tablebox { max-height: 30rem; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th[data-col] { cursor: pointer; }
th[aria-sort] { color: var(--fg); }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.s-Offer, .s-Applied-job { color: var(--ok); border-color: currentColor; }
.s-Rejected { color: var(--bad); }
.s-Ghosted, .s-Withdrawn, .s-Expired, .s-Skipped { color: var(--muted); }
.s-New { color: var(--accent); border-color: currentColor; }
.acts { display: flex; flex-direction: column; gap: 6px; min-width: 9rem; align-items: stretch; }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.frow { display: grid; grid-template-columns: 5.5rem 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.track { height: 20px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar { height: 100%; border-radius: 4px; background: var(--accent); transition: width .5s ease-out; }
.bar.ok { background: var(--ok); }
.fval { min-width: 4.5rem; text-align: right; }
.fval span { color: var(--muted); }
.chart { position: relative; min-height: 200px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); opacity: 0; white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 8px; }
.set { display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; grid-template-columns: 11rem 1fr; gap: 10px; align-items: center; }
.row > span:first-child { font-size: 13px; color: var(--muted); }
.row input[type=text], .row input[type=password] { width: 100%; max-width: 30rem; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.day { cursor: pointer; min-width: 2.8rem; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; }
.day[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.inline { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--bad); }
.welcome { border-color: var(--accent); }
.welcome ol { margin: 8px 0 0; padding-left: 20px; }
.addform { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.addform input { flex: 1 1 140px; }
.log { margin: 0; padding-left: 18px; font-size: 12px; color: var(--muted); max-height: 12rem; overflow: auto; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 20px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 640px) { .hide-sm { display: none; } .row { grid-template-columns: 1fr; } }
</style>
